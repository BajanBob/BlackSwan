# BlackSwan daily threat intelligence: refreshes www/intel/feed.json from public worldwide feeds
# (OpenPhish, Phishing.Database, abuse.ch Feodo Tracker, CISA KEV, MITRE ATT&CK) plus the curated watch list.
# Every BlackSwan app downloads the new feed once a day. Runs daily at 09:17 UTC, when the watch list changes, or by hand.
name: BlackSwan threat intel

on:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: ['www/intel/watch.json', 'scripts/update-intel.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: intel, cancel-in-progress: false }

jobs:
  intel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build feed
        env: { ABUSE_CH_KEY: '${{ secrets.ABUSE_CH_KEY }}' }
        run: node scripts/update-intel.mjs
      - name: Publish feed
        run: |
          git config user.name "blackswan-intel"
          git config user.email "blackswan-intel@users.noreply.github.com"
          git add www/intel/feed.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Threat intel $(date -u +%F)"
          git pull --rebase origin main && git push
