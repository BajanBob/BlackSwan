# Builds BlackSwan (alert and defence system, commercial edition of GuardYourPhone) and puts it on a GitHub Release tagged v<version>:
# Android APK (signed with your permanent key when the ANDROID_KEYSTORE_* secrets are set) and an unsigned iPhone .ipa.
# Runs on every push to main, or from Actions → BlackSwan app → Run workflow.
name: BlackSwan app

on:
  push:
    branches: [main]
    paths-ignore: ['www/intel/**', 'matlab/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Detection engine tests
        run: node --test "tests/*.test.mjs"
      - name: Host agent compiles
        run: python3 -m py_compile www/agent/blackswan_agent.py

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          set +e; npm run cap:android 2>&1 | tee cap.log; s=${PIPESTATUS[0]}
          if [ $s -ne 0 ]; then echo "::error title=Android project failed::$(tail -n 40 cap.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; fi
          exit $s
      - name: Build and sign the APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTROKE_PASSWORD }}  # also accepts the KEYSTROKE spelling
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          fail() { echo "::error title=Android signing::$1"; exit 1; }
          # Copy-paste often adds spaces or line breaks: strip them (they are never part of these values).
          clean() { printf '%s' "$1" | tr -d ' \r\n\t'; }
          if [ "$HAS_KEYSTORE" = "true" ]; then
            KS_PASS=$(clean "$KS_PASS"); KEY_PASS=$(clean "$KEY_PASS"); KEY_ALIAS=$(clean "$KEY_ALIAS")
            [ -n "$KS_PASS" ] || fail "The secret ANDROID_KEYSTORE_PASSWORD is empty or missing."
            [ -n "$KEY_ALIAS" ] || fail "The secret ANDROID_KEY_ALIAS is empty or missing (the alias of your key, e.g. spot)."
            [ -n "$KEY_PASS" ] || KEY_PASS=$KS_PASS
            clean "$KS_B64" | base64 -d > release.jks 2>/dev/null || fail "ANDROID_KEYSTORE_BASE64 is not valid: paste the whole long line from item 4 again."
            [ -s release.jks ] || fail "ANDROID_KEYSTORE_BASE64 decoded to nothing: paste the whole long line from item 4 again."
            keytool -list -keystore release.jks -storepass "$KS_PASS" >/dev/null 2>&1 || fail "ANDROID_KEYSTORE_PASSWORD doesn't open the keystore (or ANDROID_KEYSTORE_BASE64 is incomplete)."
            keytool -list -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 || fail "ANDROID_KEY_ALIAS is wrong: it must match the key’s alias (e.g. spot)"
            echo "Signing with the permanent key, certificate $(keytool -list -v -keystore release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | tr -d ' \t')"
          else
            echo "::warning title=Temporary signing key::Add the ANDROID_KEYSTORE_* secrets so every BlackSwan APK is signed with the same permanent key (needed so updates install over the old version)."
            KS_PASS=$(openssl rand -hex 16); KEY_PASS=$KS_PASS; KEY_ALIAS=temp
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=BlackSwan"
          fi
          ./gradlew assembleRelease --no-daemon
          grep -E 'targetSdkVersion|compileSdkVersion' ../android/variables.gradle 2>/dev/null || grep -E 'targetSdk|compileSdk' variables.gradle || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          export KS_PASS KEY_PASS
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out ../BlackSwan.apk aligned.apk \
            || { KEY_PASS=$KS_PASS; $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out ../BlackSwan.apk aligned.apk; } \
            || fail "The key couldn't sign the app: check ANDROID_KEY_PASSWORD (it is the same code as ANDROID_KEYSTORE_PASSWORD)."
          $BT/apksigner verify --print-certs ../BlackSwan.apk | grep -m1 'SHA-256' || true
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: bs-android, path: BlackSwan.apk }

  ios:
    needs: test
    runs-on: macos-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run cap:ios
      - name: Build unsigned iPhone app (sign it with an Apple Developer account to install)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/BlackSwan.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log \
            || { echo "::error title=Xcode build failed::$(grep -E 'error:|BUILD FAILED' build.log | tail -n 25 | tr -d '\r' | sed -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          mkdir -p Payload && cp -R build/BlackSwan.xcarchive/Products/Applications/App.app Payload/
          zip -qr ../../BlackSwan-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: bs-ios, path: BlackSwan-iPhone-unsigned.ipa }

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare the desktop app
        shell: bash
        run: |
          cp -r www desktop/www
          rm -rf desktop/www/agent/__pycache__
          cp assets/icon-only.png desktop/icon.png
          cd desktop
          npm pkg set version="$(node -p "require('../package.json').version")"
          npm install --no-audit --no-fund
      - name: Build (Windows portable .exe + .zip, or Linux AppImage + .tar.gz)
        working-directory: desktop
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bs-desktop-${{ runner.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/BlackSwan-Windows.zip
            desktop/dist/BlackSwan-Windows-portable.exe
            desktop/dist/BlackSwan-Linux.AppImage
            desktop/dist/BlackSwan-Linux.tar.gz
            desktop/dist/BlackSwan-Linux.zip

  agent:
    needs: test
    strategy:
      fail-fast: false
      matrix: { os: [windows-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build the host agent as one executable
        shell: bash
        run: |
          pip install --quiet pyinstaller
          NAME=blackswan-agent-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          pyinstaller --onefile --console --name "$NAME" www/agent/blackswan_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: bs-agent-${{ runner.os }}
          path: dist/blackswan-agent-*

  release:
    needs: [android, ios, desktop, agent]
    if: always() && github.ref == 'refs/heads/main' && (needs.android.result == 'success' || needs.ios.result == 'success' || needs.desktop.result == 'success' || needs.agent.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: 'bs-*', merge-multiple: true }
      - name: Package zip files for every platform
        run: |
          cd artifacts
          cat > README-FIRST.txt <<'TXT'
          BlackSwan - alert and defence system against phishing, fake websites, redirects,
          man-in-the-middle attacks, takeover scams and AI attack tools such as ARTEX.
          Design: Kammie Holder. Software: BajanBob. Built on GuardYourPhone.

          Android: open BlackSwan.apk on the phone and allow "install from this source".
          Windows: run BlackSwan.exe (or BlackSwan-Windows-portable.exe). If Windows warns about an
                   unknown publisher, choose More info -> Run anyway.
          Linux:   chmod +x BlackSwan-Linux.AppImage and run it, or unpack and run ./blackswan.
          Host agent: run from a terminal. First on a trusted network: --baseline
                   Then: --artex (find ARTEX consoles and artx working files), --logs FILE
                   (ARTEX traffic, tool mixing, config harvesting, callbacks, lateral movement),
                   --secrets FOLDER.
          BlackSwan reads only and sends nothing anywhere.
          TXT
          sed -i 's/^          //' README-FIRST.txt
          z() { out=$1; shift; have=(); for f in "$@"; do [ -e "$f" ] && have+=("$f"); done; [ ${#have[@]} -gt 0 ] && zip -q -j "$out" README-FIRST.txt "${have[@]}" && echo "made $out"; true; }
          z BlackSwan-Android.zip BlackSwan.apk
          z BlackSwan-Agent-Windows.zip blackswan-agent-windows.exe
          z BlackSwan-Agent-Linux.zip blackswan-agent-linux
          z BlackSwan-Windows-Portable.zip BlackSwan-Windows-portable.exe blackswan-agent-windows.exe
          rm README-FIRST.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BlackSwan ${{ steps.v.outputs.version }}
          make_latest: false
          body: |
            **BlackSwan: alert and defence system.** Phone security check-up (from GuardYourPhone), phishing link and scam-message scanner, intrusion monitor for fake towers, evil-twin Wi-Fi and man-in-the-middle attacks, password generator with fingerprint vault and anti brute-force lock, scam library and a desktop host agent. It reads only; it sends nothing anywhere.

            Design: **Kammie Holder** · Software: BajanBob · Built on GuardYourPhone.

            | File | For |
            |---|---|
            | **BlackSwan-Android.zip** | Android APK with instructions |
            | **BlackSwan-Windows-Portable.zip** | Windows portable .exe plus the host agent |
            | **BlackSwan-Linux.zip** | Linux desktop (unzip and run ./blackswan) |
            | **BlackSwan-Agent-Windows.zip** / **BlackSwan-Agent-Linux.zip** | Host agent with instructions |
            | **BlackSwan.apk** | Android phones: download, open, and allow "install from this source" when asked |
            | **BlackSwan-iPhone-unsigned.ipa** | iPhone: must be signed with an Apple Developer account before it can be installed |
            | **BlackSwan-Windows-portable.exe** | Windows 10/11: one file, double-click to run (no install). Windows may warn that it is from an unknown publisher: More info → Run anyway |
            | **BlackSwan-Windows.zip** | Windows desktop: unzip anywhere and run BlackSwan.exe |
            | **BlackSwan-Linux.AppImage** | Linux: make it executable (chmod +x) and run it |
            | **BlackSwan-Linux.tar.gz** | Linux: unpack and run ./blackswan |
            | **blackswan-agent-windows.exe** | Windows host agent (command line): deep network, ARTEX and leaked-secret checks |
            | **blackswan-agent-linux** | Linux host agent (command line): chmod +x, then ./blackswan-agent-linux --artex |
          files: artifacts/*
